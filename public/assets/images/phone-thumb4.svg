<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Bottom USB Edge -->
  <g transform="translate(50, 50) scale(0.35)">
    <rect x="-90" y="-12" width="180" height="24" rx="10" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <!-- Speaker holes & USB-C port -->
    <circle cx="-50" cy="0" r="3" fill="#64748B"/>
    <circle cx="-40" cy="0" r="3" fill="#64748B"/>
    <circle cx="-30" cy="0" r="3" fill="#64748B"/>
    <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#334155"/>
    <circle cx="30" cy="0" r="3" fill="#64748B"/>
    <circle cx="40" cy="0" r="3" fill="#64748B"/>
    <circle cx="50" cy="0" r="3" fill="#64748B"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" width="100%" height="100%">
  <defs>
    <filter id="watchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- Minimal Pedestal Stand -->
  <path d="M40,360 Q 180,310 320,360 L 300,430 L 60,430 Z" fill="url(#pedestalGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Watch Strap -->
  <g filter="url(#watchShadow)">
    <path d="M125,70 L 235,70 L 225,180 L 135,180 Z" fill="#2D3748" stroke="#1A202C"/>
    <path d="M135,270 L 225,270 L 235,380 L 125,380 Z" fill="#2D3748" stroke="#1A202C"/>
    <!-- Watch Case -->
    <rect x="110" y="150" width="140" height="150" rx="34" fill="#334155" stroke="#64748B" stroke-width="3"/>
    <!-- Screen Dial -->
    <rect x="118" y="158" width="124" height="134" rx="28" fill="#0A0B0D"/>
    <!-- Watch Face UI -->
    <circle cx="180" cy="225" r="48" fill="none" stroke="#1E293B" stroke-width="6"/>
    <circle cx="180" cy="225" r="48" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="160 300"/>
    <circle cx="180" cy="225" r="34" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="120 300"/>
    <line x1="180" y1="225" x2="180" y2="195" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="225" x2="205" y2="235" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="225" r="4" fill="#F8FAFC"/>
    <!-- Crown Button -->
    <rect x="250" y="180" width="12" height="30" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
  </g>
</svg>
